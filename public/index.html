<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15191c">
  <meta name="description" content="Small jumps. Big rivalries. Race through strange worlds, collect coins, and compete for the highest score in Not Mario’s World. Up to 25 players, no account needed.">
  <title>Not Mario's World — Game Day Thursday</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="runtime-warning" class="runtime-warning" role="alert" hidden></div>
  <div id="app">
    <main id="loading-screen" class="loading-screen" role="status" aria-live="polite" aria-label="Loading game">
      <div class="loading-avatars" aria-hidden="true">
        <span class="loading-avatar"><canvas width="54" height="64"></canvas></span>
        <span class="loading-avatar"><canvas width="54" height="64"></canvas></span>
        <span class="loading-avatar"><canvas width="54" height="64"></canvas></span>
        <span class="loading-avatar"><canvas width="54" height="64"></canvas></span>
      </div>
      <p class="loading-caption">Loading worlds<span class="loading-dots" aria-hidden="true">...</span></p>
    </main>
  </div>
  <div id="world-announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <script type="module" src="/bootstrap.js"></script>
</body>
</html>
