<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Level Runner</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<header><a href="index.html">← Companion</a><strong>JSON LEVEL RUNNER</strong><span id="levelName">Loading…</span><label class="button">Open JSON<input id="levelFile" type="file" accept="application/json,.json"></label><button id="sampleBtn">Load forest test</button><button id="playBtn">Pause</button><button id="resetBtn">Restart</button><label><input id="colliders" type="checkbox"> Collision overlays</label><button id="followBtn">Follow player</button><button id="fitBtn">Fit level</button></header>
<section class="settings"><label>JSON URL <input id="levelUrl" aria-label="Level JSON URL" placeholder="/assets/sprites/…/level.json"></label><button id="loadUrl">Load URL</button><label>Spawn X <input id="spawnX" aria-label="Spawn X" type="number" step="any"></label><label>Spawn Y <input id="spawnY" aria-label="Spawn Y" type="number" step="any"></label><button id="setSpawn">Set spawn & restart</button><button id="pickSpawn">Pick spawn on canvas</button></section>
<p id="message" role="status">Loading level data…</p>
<main><canvas id="levelCanvas" tabindex="0" aria-label="Playable JSON level"></canvas><div id="deathNotice" hidden></div><div id="finishNotice" role="status" hidden>Exit reached · Press R or Restart to play again.</div></main>
<footer><span>A/D or arrows: move · Space/W/↑: jump · R: restart · Drag: inspect · Wheel: zoom</span><span id="stats"></span></footer><script type="module" src="viewer.js"></script>
</body></html>
